name: Release

# A strict-semver `vX.Y.Z[-pre]` tag cuts a GitHub release as a DRAFT, so the
# notes can be written before publishing. The tag must equal the version in the
# workspace Cargo.toml, so the version bump is committed before tagging.
# `workflow_dispatch` builds every artifact without publishing, for dry runs.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  meta:
    name: Release identity
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.id.outputs.version }}
      git_hash: ${{ steps.id.outputs.git_hash }}
      build_date: ${{ steps.id.outputs.build_date }}
    steps:
      - uses: actions/checkout@v7

      - name: Validate tag and read version
        id: id
        run: |
          set -eu
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "git_hash=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            semver='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$'
            if ! printf '%s' "$GITHUB_REF_NAME" | grep -Eq "$semver"; then
              echo "::error::tag $GITHUB_REF_NAME is not strict semver (vMAJOR.MINOR.PATCH[-prerelease])"
              exit 1
            fi
            if [ "$GITHUB_REF_NAME" != "v$version" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
              exit 1
            fi
          fi

  test:
    name: Test
    needs: meta
    uses: ./.github/workflows/test.yml

  build:
    name: Build
    needs: [meta, test]
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.meta.outputs.version }}
      asset_prefix: fx-v${{ needs.meta.outputs.version }}
      git_hash: ${{ needs.meta.outputs.git_hash }}
      build_date: ${{ needs.meta.outputs.build_date }}

  publish:
    name: Draft release
    needs: [meta, build]
    # `always()` so a red Windows/macOS leg still publishes the other
    # artifacts; the build job itself only fails when a required (Linux) leg
    # fails. Dry runs (no tag) never publish.
    if: always() && needs.build.result == 'success' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create draft release
        run: |
          set -eux
          cd artifacts
          sha256sum $(ls | grep -v '\.sha256$') > SHA256SUMS
          flags=
          case "$TAG" in *-*) flags=--prerelease ;; esac
          notes=$(mktemp)
          if ls ./*.dmg >/dev/null 2>&1; then
            printf '%s\n%s\n' \
              "macOS build is unsigned (no Apple Developer account yet) — Gatekeeper will refuse to open it." \
              "Run \`xattr -cr /Applications/fx.app\` after copying it, or right-click → Open instead of double-clicking." \
              > "$notes"
          fi
          gh release create "$TAG" --draft $flags \
            --title "$TAG" \
            --generate-notes \
            --notes-file "$notes" \
            ./*
