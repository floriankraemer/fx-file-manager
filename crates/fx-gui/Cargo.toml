[package]
name = "fx-gui"
edition.workspace = true
version.workspace = true
publish.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
eframe = "0.37.0"
egui = "0.37.0"
egui_extras = "0.37.0"
fontdb = "0.23"
fx-app = { path = "../fx-app" }
fx-core = { path = "../fx-core" }
icon-theme = { path = "../icon-theme" }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
x11rb = "0.13.2"

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
drag = "2.1.1"
raw-window-handle = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["std", "NSApplication", "NSWindow", "NSView", "NSResponder"] }

[dev-dependencies]
egui_kittest = { version = "0.37.0", default-features = false }

[build-dependencies]
winresource = "0.1.34"

[lints]
workspace = true
