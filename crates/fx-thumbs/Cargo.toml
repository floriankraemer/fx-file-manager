[package]
name = "fx-thumbs"
edition.workspace = true
version.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
# Pure Rust decoders only, so the Windows cross-build through MXE needs nothing native.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }
# Scaled IDCT: decodes a photo at up to 1/8 of its size, the main cost saving for camera JPEGs.
jpeg-decoder = { version = "0.3", default-features = false }
fast_image_resize = { version = "6", features = ["image"] }

[target.'cfg(target_os = "linux")'.dependencies]
log = "0.4"
md-5 = "0.11"
png = "0.18"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_UI_Shell"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
