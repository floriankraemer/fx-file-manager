[package]
name = "fx-core"
edition.workspace = true
version.workspace = true
publish.workspace = true
rust-version.workspace = true

[features]
# Opt-in io_uring small-file copy (Linux only, experimental, see docs/copy-engine.md).
uring = ["dep:io-uring"]

[dependencies]
rayon = "1"
# Content hash for verified copies: streaming XXH3 only, no further dependencies.
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1", features = ["fs", "std", "process"] }
io-uring = { version = "0.7", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
rustix = { version = "1", features = ["fs", "std", "process"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl", "Win32_Security"] }
