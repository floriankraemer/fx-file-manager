[workspace]
members = ["crates/fx-core", "crates/fx-app", "crates/fx-cli", "crates/fx-gui", "crates/icon-theme"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.4.0"
publish = false
authors = ["Florian Krämer"]
repository = "https://github.com/floriankraemer/fx-file-manager"
license = "GPL-3.0-only"
rust-version = "1.95"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"

# Complexity gate: CI runs clippy with `-D warnings`, so these fail the build. Thresholds in clippy.toml.
[workspace.lints.clippy]
cognitive_complexity = "warn"
excessive_nesting = "warn"
too_many_lines = "warn"
